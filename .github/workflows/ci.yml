name: Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - master
      - staging
      - develop
  pull_request:
    branches:
      - develop
      - staging
      - master

jobs:
  validate:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Linting Checks
        run: |
          # Runs eslint to check code style and common bugs
          npm run lint --if-present

      - name: Run Unit Tests
        run: |
          # Run tests and generate coverage report
          npm test --if-present

      - name: SonarQube Analysis Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Prevent proceeding to build if SonarQube Quality Gate fails
      - name: SonarQube Quality Gate Status
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Docker Build & Push
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Only build and push on successful merges/pushes, not PR validation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Branch Name
        shell: bash
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            pulkit197/fitness_tracker-fitness-app:${{ env.BRANCH }}
            pulkit197/fitness_tracker-fitness-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
