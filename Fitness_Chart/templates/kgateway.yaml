{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "fitness-tracker.fullname" . }}-gateway
  labels:
    {{- include "fitness-tracker.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fitness-tracker.fullname" . }}-route
  labels:
    {{- include "fitness-tracker.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "fitness-tracker.fullname" . }}-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "fitness-tracker.fullname" . }}-service
          port: {{ .Values.app.service.port }}
{{- end }}
